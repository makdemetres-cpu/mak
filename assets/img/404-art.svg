      <ellipse cx="20" cy="12" rx="5" ry="6.8"/><ellipse cx="29" cy="12" rx="5" ry="6.8"/>
      <ellipse cx="38" cy="18" rx="5" ry="6.5"/>
    </g>
    <g transform="translate(128 238) rotate(4) scale(0.78)">
