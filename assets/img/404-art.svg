      <ellipse cx="24" cy="31" rx="12" ry="9.5"/><ellipse cx="11" cy="17" rx="5" ry="6.5"/>
      <ellipse cx="20" cy="12" rx="5" ry="6.8"/><ellipse cx="29" cy="12" rx="5" ry="6.8"/>
